apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-petclinic-petclinic
  labels:
    app: spring-petclinic-petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-petclinic-petclinic
  template:
    metadata:
      labels:
        app: spring-petclinic-petclinic
    spec:
      containers:
      - name: spring-petclinic-petclinic
        image: docker.io/tahaa13/spring-petclinic-petclinic:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: spring-petclinic-postgres-credentials
              key: url
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: spring-petclinic-postgres-credentials
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: spring-petclinic-postgres-credentials
              key: password
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /livez
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /livez
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /livez
            port: 8080
          failureThreshold: 30
          periodSeconds: 10
        securityContext:
          runAsGroup: 0
          runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: spring-petclinic-petclinic
  labels:
    app: spring-petclinic-petclinic
spec:
  ports:
  - port: 8080
    targetPort: http
  selector:
    app: spring-petclinic-petclinic
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: spring-petclinic-petclinic
  labels:
    app: spring-petclinic-petclinic
spec:
  to:
    kind: Service
    name: spring-petclinic-petclinic
  tls:
    termination: edge
